    httpMethods:
      - POST
    uri: api/v3/orderer/orders
    metadata:
      custom:
        resources:
          - OrderResource
        models:
          - User
          - Cart
          - RestaurantTable
          - Order
          - Reservation
          - CartItem
          - Restaurant
          - PromoCode
          - Orphanage
          - Setting
          - OrderItem
          - Discount
          - FoodCommonCategory
          - CategoryMenu
      groupName: Orders
      groupDescription: |-

        Customer and restaurant order endpoints: placing orders and dine-in reservations, listing and viewing orders,
        updating order/reservation status, assigning tables and riders, and exporting orders.
      subgroup: ''
      subgroupDescription: ''
      title: 'Place an order'
      description: |-
        Only users with role `orderer` may call this. If `cartId` matches one of the user's carts, the cart items are turned
        into order items, menu discounts and an optional promo code are applied, a service charge is added, and a delivery fee
        is computed for deliveries (from the delivery coordinates) or orphanage deliveries (via Google Distance Matrix); the
        cart is then deleted. If no cart matches, a dine-in reservation order is created instead (requires `seating_area_id`,
        `seat_number` and `booking_time`).
      authenticated: true
      deprecated: false
    headers:
      Authorization: 'Bearer {YOUR_ACCESS_TOKEN}'
      Content-Type: application/json
      Accept: application/json
    urlParameters: []
    cleanUrlParameters: []
    queryParameters: []
    cleanQueryParameters: []
    bodyParameters:
      cartId:
        custom: []
        name: cartId
        description: "The id of the user's cart to check out. Omit for a dine-in reservation."
        required: false
        example: 5
        type: integer
        enumValues: []
        exampleWasSpecified: true
        nullable: true
        deprecated: false
      restaurantId:
        custom: []
        name: restaurantId
        description: 'The id of the restaurant.'
        required: true
        example: 3
        type: integer
        enumValues: []
        exampleWasSpecified: true
        nullable: false
        deprecated: false
      delivery:
        custom: []
        name: delivery
        description: 'Whether the order is delivered. Required unless `orphanage_id` is given.'
        required: false
        example: true
        type: boolean
        enumValues: []
        exampleWasSpecified: true
        nullable: false
        deprecated: false
      delivery_address:
        custom: []
        name: delivery_address
        description: 'Delivery address. Required if `delivery` is true.'
        required: false
        example: '221B Baker Street, London'
        type: string
        enumValues: []
        exampleWasSpecified: true
        nullable: false
        deprecated: false
      delivery_location_lat:
        custom: []
        name: delivery_location_lat
        description: 'Delivery latitude. Required if `delivery` is true.'
        required: false
        example: 51.5237
        type: number
        enumValues: []
        exampleWasSpecified: true
        nullable: false
        deprecated: false
      delivery_location_lng:
        custom: []
        name: delivery_location_lng
        description: 'Delivery longitude. Required if `delivery` is true.'
        required: false
        example: -0.1585
        type: number
        enumValues: []
        exampleWasSpecified: true
        nullable: false
        deprecated: false
      booking_time:
        custom: []
        name: booking_time
        description: 'Dining/booking time in `Y-m-d H:i`, must be in the future. Required if `delivery` is false, and for reservations.'
        required: false
        example: '2030-01-15 19:30'
        type: string
        enumValues: []
        exampleWasSpecified: true
        nullable: false
        deprecated: false
      promo_code:
        custom: []
        name: promo_code
        description: 'A promo code for the restaurant.'
        required: false
        example: SAVE10
        type: string
        enumValues: []
        exampleWasSpecified: true
        nullable: false
        deprecated: false
      orphanage_id:
        custom: []
        name: orphanage_id
